<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordatorios de Renovación - Gimnasio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Recordatorios de renovación</h1>
<p class="ayuda">Pega una lista de socios, una por línea: <code>nombre|días vencidos|plan</code><br>Ejemplo: <code>María López|14|Mensualidad</code></p>
<div id="modo" class="modo"></div>
<textarea id="entrada" placeholder="María López|14|Mensualidad
Juan Pérez|5|Anual"></textarea>
<br>
<div class="controles">
  <button id="btnGenerar">Generar mensajes</button>
  <select id="filtroOrden">
    <option value="desc">Ordenar: días vencidos (mayor a menor)</option>
    <option value="asc">Ordenar: días vencidos (menor a mayor)</option>
  </select>
  <button id="btnFiltrar">Aplicar orden</button>
</div>
<div id="error" class="error"></div>
<div id="resultados" class="resultados-grid"></div>
<script src="/static/app.js"></script>
</body>
</html>
