<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordatorios de Renovación - Gimnasio</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  p.ayuda { color: #555; margin-bottom: 1rem; }
  textarea { width: 100%; height: 170px; font-size: 1rem; font-family: inherit; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .resultado { margin-top: 1rem; border: 1px solid #ddd; padding: 1rem; border-radius: 8px; background: #fafafa; }
  .socio-label { font-weight: bold; margin-bottom: 0.5rem; font-size: 0.95rem; }
  .mensaje { margin-bottom: 0.75rem; padding: 0.75rem; background: #fff; border: 1px solid #eee; border-radius: 6px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; }
  .tono { font-weight: bold; text-transform: uppercase; font-size: 0.78rem; color: #666; margin-bottom: 0.25rem; letter-spacing: 0.5px; }
  .copiar { font-size: 0.82rem; padding: 0.25rem 0.6rem; margin-top: 0.35rem; float: right; }
  .error { color: #b00020; margin-top: 1rem; }
  .modo { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>Recordatorios de renovación</h1>
<p class="ayuda">Pega una lista de socios, una por línea: <code>nombre|días vencidos|plan</code><br>Ejemplo: <code>María López|14|Mensualidad</code></p>
<div id="modo" class="modo"></div>
<textarea id="entrada" placeholder="María López|14|Mensualidad
Juan Pérez|5|Anual"></textarea>
<br>
<button id="btnGenerar">Generar mensajes</button>
<div id="error" class="error"></div>
<div id="resultados"></div>
<script src="app.js"></script>
</body>
</html>
